litellm_settings:
  # Report every call (model + latency + cost) to the console's Requests view.
  # Path is relative to the process cwd, which the manager sets to the console dir.
  callbacks: config.router_callback.betenshi_logger
  # Providers disagree about which knobs exist (negative_prompt, cfg, steps are
  # local-only; reasoning_effort is OpenAI-only). Drop unsupported params rather
  # than 400-ing, so one prompt can fan out across every model unchanged.
  drop_params: true
  # Keep a local model's cold start from being read as a failure.
  request_timeout: 600

general_settings:
  # No DB — model list is this file. Keeps the router a stateless, restartable
  # process with no extra infrastructure.
  store_model_in_db: false
  # Pass the caller's headers upstream so X-Source survives the extra hop and
  # images stay attributable to the app that asked for them ("quote-forge",
  # "console") instead of all collapsing to "router" in the Activity archive.
  # `user` can't do this job: our local model isn't in LiteLLM's registry, so
  # drop_params strips it as an unsupported param.
  forward_client_headers_to_llm_api: true
